<a class="card post-card" href="{{ include.post.url | relative_url }}">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
  <h3>{{ include.post.title }}</h3>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncatewords: 28 }}</p>
  <span class="more">Read →</span>
</a>
