---
title: Career
---
<section class="section prose-page">
  <div class="wrap">
    <h1>Career</h1>
    <div class="post-list">
      {%- assign roles = site.career | sort: "title" -%}
      {%- for r in roles %}
      <a class="card post-card" href="{{ r.url | relative_url }}">
        {% if r.role %}<span class="meta">{{ r.role }}</span>{% endif %}
        <h3>{{ r.title }}</h3>
        {% if r.description %}<p>{{ r.description }}</p>{% endif %}
        <span class="more">Read →</span>
      </a>
      {%- else %}
      <p class="muted">No career guides yet.</p>
      {%- endfor %}
    </div>
  </div>
</section>
