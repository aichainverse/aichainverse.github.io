---
layout: default
---
<article class="section prose-page">
  <div class="wrap narrow">
    <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
