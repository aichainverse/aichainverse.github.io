title: AIChainverse
tagline: Your Daily Dose of AI, Web3 & Data Science
# Channel "about" line from YouTube, used for the meta description.
description: >-
  Welcome to AIChainverse – the infotainment channel where Web3,
  cryptocurrency, blockchain, AI, AI agents, and data science meet.
url: https://aichainverse.github.io
baseurl: ""
lang: en
timezone: Asia/Karachi

logo: /assets/img/logo.png
author:
  name: Umer Majeed

social:
  name: AIChainverse
  links:
    - https://www.youtube.com/@AIchainVerse
    - https://www.facebook.com/aichainverse
    - https://www.tiktok.com/@aichainverse
    - https://github.com/aichainverse

links:
  youtube: https://www.youtube.com/@AIchainVerse
  subscribe: https://www.youtube.com/@AIchainVerse?sub_confirmation=1
  facebook: https://www.facebook.com/aichainverse
  tiktok: https://www.tiktok.com/@aichainverse
  github: https://github.com/aichainverse

# Top navigation. An item is highlighted on its own URL and anything under it, plus any `sections` listed.
nav:
  - { title: Videos, url: /videos/ }
  - { title: Learn, url: /learn/, sections: "/guides/,/tutorials/,/career/,/glossary/,/resources/" }
  - { title: Jobs, url: /jobs/ }
  - { title: Blog, url: /blog/ }
  - { title: About, url: /about/ }

permalink: /blog/:year/:month/:day/:title/

# Collections publish at /<collection>/<file-name>/ (e.g. _guides/rag.md -> /guides/rag/).
collections:
  guides:
    output: true
    permalink: /guides/:name/
    sort_by: date
  tutorials:
    output: true
    permalink: /tutorials/:name/
    sort_by: date
  videos:
    output: true
    permalink: /videos/:name/
    sort_by: date
  career:
    output: true
    permalink: /career/:name/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

# All three are on the GitHub Pages plugin allowlist, so the built-in
# Pages build runs them without a custom Actions workflow.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: guides }
    values: { layout: guide }
  - scope: { path: "", type: tutorials }
    values: { layout: guide }
  - scope: { path: "", type: videos }
    values: { layout: video }
  - scope: { path: "", type: career }
    values: { layout: career }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
