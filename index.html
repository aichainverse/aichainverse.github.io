---
layout: default
---
<section class="hero" id="top">
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="wrap hero-inner">
    <div class="hero-copy">
      <h1>{{ site.title }}</h1>
      <p class="lede">{{ site.tagline }}</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="{{ site.links.youtube }}" target="_blank" rel="noopener">{% include icon.html name="youtube" %} YouTube</a>
        <a class="btn btn-ghost" href="{{ site.links.facebook }}" target="_blank" rel="noopener">{% include icon.html name="facebook" %} Facebook</a>
      </div>
    </div>
  </div>
</section>
